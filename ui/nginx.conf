server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /axioma/ {
        try_files $uri $uri/ /axioma/index.html;
    }

    location = /axioma {
        return 301 /axioma/;
    }

    location / {
        return 301 /axioma/;
    }

    # Error handling
    error_page 404 /axioma/index.html;
}
